<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/nav-menu.css" />
  <link rel="stylesheet" href="css/panic.css" />
  <title>Panic-SA</title>
</head>
<body class="bg-bg text-text min-h-screen">

  <main class="flex flex-col items-center justify-center min-h-[calc(100vh-140px)] px-4">
    <h1 class="text-3xl md:text-4xl font-bold text-text mb-2 tracking-wide">Panic-SA</h1>
    <p class="text-text-muted text-sm md:text-base mb-10 text-center max-w-xs">
      One tap emergency alert
    </p>

    <div id="alert" class="panic-alert" style="display: none;"></div>

    <div class="panic-container">
      <button id="panic-button" class="panic-button" type="button" aria-label="Send SOS emergency alert">
        SOS
      </button>
      <button id="cancel-button" class="cancel-button" type="button" aria-label="Cancel SOS emergency alert" style="display: none;">
        Cancel SOS
      </button>
    </div>

    <p id="panic-status" class="panic-status"></p>

    <div class="loader" aria-hidden="true"></div>
  </main>

  <div id="cancel-modal" class="cancel-modal-overlay" style="display: none;" aria-hidden="true">
    <div class="cancel-modal" role="dialog" aria-labelledby="cancel-modal-title">
      <h2 id="cancel-modal-title" class="cancel-modal-title">Cancel SOS alert?</h2>
      <p class="cancel-modal-warning">
        Cancelling will stop live location sharing with your emergency contacts.
      </p>

      <label class="cancel-modal-label" for="cancel-reason">Why are you cancelling?</label>
      <select id="cancel-reason" class="cancel-modal-select">
        <option value="">Select a reason...</option>
        <option value="I am safe now">I am safe now</option>
        <option value="Triggered by mistake">Triggered by mistake</option>
        <option value="Help has arrived">Help has arrived</option>
        <option value="Other">Other</option>
      </select>

      <label id="cancel-detail-label" class="cancel-modal-label" for="cancel-reason-detail" style="display: none;">
        Please describe
      </label>
      <textarea
        id="cancel-reason-detail"
        class="cancel-modal-textarea"
        rows="3"
        placeholder="Tell us why you are cancelling..."
        style="display: none;"
      ></textarea>

      <p id="cancel-modal-error" class="cancel-modal-error" style="display: none;"></p>

      <div class="cancel-modal-actions">
        <button id="cancel-confirm-button" class="cancel-modal-confirm" type="button" disabled>
          Confirm cancel
        </button>
        <button id="cancel-dismiss-button" class="cancel-modal-dismiss" type="button">
          Keep alert active
        </button>
      </div>
    </div>
  </div>

  <footer class="bottom-footer">
    Panic-SA &copy; 2026 Copyright Reserved
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/api.js"></script>
  <script src="components/nav-menu.js" defer></script>
  <script src="js/panic.js"></script>
</body>
</html>
