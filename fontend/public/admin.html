<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/nav-menu.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <title>Admin Dashboard - Panic-SA</title>
</head>
<body>

<div id="alert" class="admin-alert" style="display: none;"></div>

<div class="admin-controls">
  <label for="status-filter">Status:</label>
  <select id="status-filter">
    <option value="all">All</option>
    <option value="active">Active</option>
    <option value="cancelled">Cancelled</option>
  </select>
</div>

<div class="Active-Alerts responsive-table">
  <table>
    <thead>
      <tr>
        <th>Alert ID</th>
        <th>User ID</th>
        <th>Latitude</th>
        <th>Longitude</th>
        <th>Status</th>
        <th>TimeStamp</th>
        <th>Map</th>
      </tr>
    </thead>
    <tbody id="admin-alerts-body"></tbody>
  </table>
</div>

<div class="statistic-container">
  <div class="stat-card">
    <h3>Total Alerts:</h3>
    <p class="total-alerts">0</p>
  </div>
  <div class="stat-card">
    <h3>Todays Alerts:</h3>
    <p class="today-alerts">0</p>
  </div>
  <div class="stat-card">
    <h3>Active Alerts:</h3>
    <p class="active-alerts">0</p>
  </div>
</div>

<div class="loader"></div>

<footer class="bottom-footer">
  Panic-SA &copy; 2026 Copyright Reserved
</footer>

<script src="js/auth.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/api.js"></script>
<script src="components/nav-menu.js" defer></script>
<script src="js/admin.js"></script>
</body>
</html>
